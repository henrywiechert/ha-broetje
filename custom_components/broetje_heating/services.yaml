zone_boost:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: broetje_heating
    zone:
      required: true
      selector:
        number:
          min: 1
          max: 12
          mode: box
    duration:
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    control_mode:
      default: keep
      selector:
        select:
          options:
            - keep
            - manual

debug_read_register:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: broetje_heating
    address:
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      selector:
        number:
          min: 1
          max: 125
          mode: box
    register_type:
      selector:
        select:
          options:
            - holding
            - input
    data_type:
      selector:
        select:
          options:
            - raw
            - uint16
            - int16
            - uint32
            - int32
            - string
            - time_of_day

debug_write_register:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: broetje_heating
    address:
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    values:
      required: true
      selector:
        object:
    confirm:
      required: true
      selector:
        boolean:
